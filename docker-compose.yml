services:
  cinnabar:
    image: ${DOCKER_REGISTRY-}cinnabar
    build:
      context: .
      dockerfile: src/Cinnabar.Server/Dockerfile
    ports:
      - "6379:6379"   # RESP
      - "9090:9090"   # Prometheus metrics
    volumes:
      - cinnabar-data:/data

  sample-api:
    image: ${DOCKER_REGISTRY-}cinnabar-sample-api
    build:
      context: .
      dockerfile: samples/Cinnabar.Samples.WebApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Redis__Host=cinnabar
    depends_on:
      - cinnabar

volumes:
  cinnabar-data:
